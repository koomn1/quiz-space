<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO & Site Identity -->
    <title>QuizSpace - Premium Intelligence</title>
    <meta name="description" content="QuizSpace - The premium assessment and learning platform." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Open Graph Meta Tags for Facebook, WhatsApp & Social link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quiz Space" />
    <meta property="og:title" content="Quiz Space | تعلّم، نافس، وتصدّر" />
    <meta property="og:description" content="منصتك الذكية لصناعة الاختبارات وحلها ومشاركة التحدي مع أصدقائك." />
    <meta property="og:url" content="https://koomn1.github.io/quiz-space/" />
    <meta property="og:image" content="https://koomn1.github.io/quiz-space/share-card.jpg" />
    <meta property="og:image:alt" content="دعوة للانضمام إلى Quiz Space مع شعار المنصة" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quiz Space | تعلّم، نافس، وتصدّر" />
    <meta name="twitter:description" content="منصتك الذكية لصناعة الاختبارات وحلها ومشاركة التحدي مع أصدقائك." />
    <meta name="twitter:image" content="https://koomn1.github.io/quiz-space/share-card.jpg" />
    <meta name="twitter:image:alt" content="دعوة للانضمام إلى Quiz Space مع شعار المنصة" />

    <!-- WhatsApp specific enhancements -->
    <meta property="og:locale" content="ar_AR" />
    
    <!-- QuizSpace Brand Identity -->
    <link rel="icon" type="image/png" href="./brand/quizspace-icon-192.webp" />
    <link rel="apple-touch-icon" href="./brand/quizspace-icon-192.webp" />
    <meta name="theme-color" content="#0b0824" />
  </head>
  <body>
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
