name = "quiz-space-ai"
main = "src/index.ts"
compatibility_date = "2026-07-24"

# Set secrets with `npx wrangler secret put <NAME>`; never add them here.
# Required: INCEPTION_API_KEY, XKIRO_API_KEY, SUPABASE_URL, SUPABASE_ANON_KEY,
# ALLOWED_ORIGIN

[[queues.producers]]
queue = "quizspace-extraction-jobs"
binding = "EXTRACTION_JOBS"

[[queues.consumers]]
queue = "quizspace-extraction-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 2
max_concurrency = 3

# Shared rate limits (Cloudflare Rate Limiting binding). Limits match RATE_LIMIT_POLICIES
# in src/security/rateLimiter.ts. period must be 10 or 60 seconds. namespace_id values
# are arbitrary unique integers per account. If a binding is removed the worker falls
# back to the per-isolate in-memory limiter.
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_AI_GUEST"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_AI_AUTH"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_EXPENSIVE_GUEST"
namespace_id = "1004"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RL_EXPENSIVE_AUTH"
namespace_id = "1005"
simple = { limit = 8, period = 60 }
