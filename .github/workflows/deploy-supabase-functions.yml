name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/mobile-firebase-session-v2/**'
      - 'supabase/functions/send-promotion-push/**'
      - 'supabase/functions/send-daily-engagement-reminders/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy active Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${VITE_SUPABASE_URL:-}" ]]; then
            echo 'Configure SUPABASE_ACCESS_TOKEN and VITE_SUPABASE_URL repository secrets.' >&2
            exit 1
          fi
          project_ref="${VITE_SUPABASE_URL#https://}"
          project_ref="${project_ref%%.*}"
          if [[ ! "$project_ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo 'VITE_SUPABASE_URL does not contain a valid Supabase project ref.' >&2
            exit 1
          fi
          for function_name in \
            mobile-firebase-session-v2 \
            send-promotion-push \
            send-daily-engagement-reminders; do
            pnpm exec supabase functions deploy "$function_name" \
              --project-ref "$project_ref" \
              --no-verify-jwt \
              --use-api
          done
