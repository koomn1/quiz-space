name: Mobile Flutter Native CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile_flutter/**'
      - 'supabase/functions/mobile-firebase-session/**'
      - '.github/workflows/mobile-native-ci.yml'
  pull_request:
    paths:
      - 'mobile_flutter/**'
      - 'supabase/functions/mobile-firebase-session/**'
      - '.github/workflows/mobile-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-debug-build:
    name: Analyze, test, and debug-build Native Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name badawy --org com.quizspace .

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Configure Firebase Android project
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_ANDROID_CONFIG_JSON"
          mkdir -p config
          printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > config/google-services.json
          python3 tool/prepare_android_firebase.py

      - name: Resolve Google server client ID without exposing it
        shell: bash
        run: |
          set -euo pipefail
          GOOGLE_SERVER_CLIENT_ID=$(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('config/google-services.json').read_text(encoding='utf-8'))
          packages = [item.get('client_info', {}).get('android_client_info', {}).get('package_name') for item in data.get('client', [])]
          if 'com.quizspace.badawy' not in packages:
              raise SystemExit('Firebase config does not contain the Native package com.quizspace.badawy')
          ids = [oauth.get('client_id') for item in data.get('client', []) for oauth in item.get('oauth_client', []) if oauth.get('client_type') == 3 and oauth.get('client_id')]
          if not ids:
              raise SystemExit('Firebase config is missing the Web OAuth client required for Google ID tokens')
          print(ids[0])
          PY
          )
          echo "::add-mask::$GOOGLE_SERVER_CLIENT_ID"
          echo "GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID" >> "$GITHUB_ENV"

      - name: Configure Android manifest and native bridges
        run: |
          python3 tool/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
          python3 tool/prepare_native_permissions.py

      - name: Generate official QuizSpace launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Dart and widget tests
        run: flutter test

      - name: Build debug APK without publishing
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          AI_WORKER_URL: ${{ secrets.VITE_AI_WORKER_URL }}
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          --dart-define=AI_WORKER_URL=$AI_WORKER_URL
          --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID

      - name: Verify Android signing secret for device UAT
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/quizspace-upload-keystore.jks
          actual_hash=$(sha256sum /tmp/quizspace-upload-keystore.jks | cut -d' ' -f1)
          if [ "$actual_hash" != "de9382e0ca60f6191f7ae631f63c850ac27be179d2fdf2345057238d6d3c321b" ]; then
            echo 'The Android keystore secret payload is corrupted or incomplete.'
            exit 1
          fi
          if ! keytool -list -keystore /tmp/quizspace-upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo 'The Android keystore payload is correct but its password secret is incorrect.'
            exit 1
          fi

      - name: Configure Android release signing for device UAT
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          python3 tool/prepare_android_signing.py

      - name: Build signed Native UAT APK without publishing
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          AI_WORKER_URL: ${{ secrets.VITE_AI_WORKER_URL }}
        run: >-
          flutter build apk --release
          --build-name=3.0.0
          --build-number=$((3000000 + GITHUB_RUN_NUMBER))
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          --dart-define=AI_WORKER_URL=$AI_WORKER_URL
          --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID

      - name: Upload Native signed UAT APK
        uses: actions/upload-artifact@v4
        with:
          name: quizspace-native-signed-uat-${{ github.run_number }}
          path: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Native debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: quizspace-native-debug-${{ github.run_number }}
          path: mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
