name: Mobile Flutter Native CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile_flutter/**'
      - 'supabase/functions/mobile-firebase-session/**'
      - '.github/workflows/mobile-native-ci.yml'
  pull_request:
    paths:
      - 'mobile_flutter/**'
      - 'supabase/functions/mobile-firebase-session/**'
      - '.github/workflows/mobile-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-debug-build:
    name: Analyze, test, and debug-build Native Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name badawy --org com.quizspace .

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Configure Firebase Android project
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_ANDROID_CONFIG_JSON"
          mkdir -p config
          printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > config/google-services.json
          python3 tool/prepare_android_firebase.py

      - name: Configure Android manifest and native bridges
        run: |
          python3 tool/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
          python3 tool/prepare_native_permissions.py

      - name: Generate official QuizSpace launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Dart and widget tests
        run: flutter test

      - name: Build debug APK without publishing
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          AI_WORKER_URL: ${{ secrets.VITE_AI_WORKER_URL }}
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          --dart-define=AI_WORKER_URL=$AI_WORKER_URL
