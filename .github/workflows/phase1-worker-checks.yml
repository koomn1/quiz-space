name: Phase 1 Worker Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'vitest.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/phase1-worker-checks.yml'

permissions:
  contents: read

jobs:
  worker-tests:
    name: Worker unit tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Worker tests
        run: pnpm exec vitest run worker/src/taskLedger.test.ts worker/src/queue.test.ts

      - name: Typecheck Worker
        run: pnpm exec tsc --noEmit -p worker/tsconfig.json
