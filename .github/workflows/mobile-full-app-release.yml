name: QuizSpace Full Android App Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag like mobile-v2.0.123'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-full-app-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build full website Android app and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web and Capacitor packages
        run: pnpm install --frozen-lockfile --child-concurrency=1 --network-concurrency=4

      - name: Calculate release version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          requested_tag='${{ inputs.release_tag }}'
          if [ -n "$requested_tag" ]; then
            release_tag="$requested_tag"
          else
            release_tag="mobile-v2.0.${GITHUB_RUN_NUMBER}"
          fi
          version_name="${release_tag#mobile-v}"
          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must look like mobile-v2.0.123'
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build all website pages into dist
        env:
          VITE_APP_VERSION: ${{ steps.release_meta.outputs.version_name }}
        run: pnpm build

      - name: Remove web compression sidecars from Android assets
        run: find dist -type f \( -name '*.gz' -o -name '*.br' \) -delete

      - name: Sync website into Android app
        run: pnpm exec cap sync android

      - name: Verify Android signing secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/quizspace-upload-keystore.jks
          actual_hash=$(sha256sum /tmp/quizspace-upload-keystore.jks | cut -d' ' -f1)
          if [ "$actual_hash" != "de9382e0ca60f6191f7ae631f63c850ac27be179d2fdf2345057238d6d3c321b" ]; then
            echo 'The Android keystore secret payload is corrupted or incomplete.'
            exit 1
          fi
          keytool -list -keystore /tmp/quizspace-upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          python3 scripts/prepare_capacitor_signing.py

      - name: Set Android version
        env:
          VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
        run: python3 scripts/set_capacitor_version.py

      - name: Build signed full app APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signing continuity
        shell: bash
        run: |
          set -euo pipefail
          current_apk='android/app/build/outputs/apk/release/app-release.apk'
          latest_url=$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/koomn1/quiz-space/releases/latest | jq -r '.assets[]? | select(.name == "quizspace-mobile.apk") | .browser_download_url' | head -n1)
          if [ -z "$latest_url" ] || [ "$latest_url" = "null" ]; then
            echo 'No previous APK release found; skipping continuity check.'
            exit 0
          fi
          curl -fsSL "$latest_url" -o /tmp/previous-quizspace.apk
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          current_cert=$("$apksigner_path" verify --print-certs "$current_apk" | awk -F': ' '/SHA-256 digest:/ {print $2; exit}')
          previous_cert=$("$apksigner_path" verify --print-certs /tmp/previous-quizspace.apk | awk -F': ' '/SHA-256 digest:/ {print $2; exit}')
          test -n "$current_cert" && test -n "$previous_cert"
          test "$current_cert" = "$previous_cert"

      - name: Prepare release files
        id: release_files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk release-artifacts/quizspace-mobile.apk
          (cd release-artifacts && sha256sum quizspace-mobile.apk > quizspace-mobile.apk.sha256)
          echo "apk_path=release-artifacts/quizspace-mobile.apk" >> "$GITHUB_OUTPUT"
          echo "checksum_path=release-artifacts/quizspace-mobile.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: QuizSpace Full Android App ${{ steps.release_meta.outputs.release_tag }}
          generate_release_notes: true
          files: |
            ${{ steps.release_files.outputs.apk_path }}
            ${{ steps.release_files.outputs.checksum_path }}
          body: |
            تطبيق Android كامل يشغّل كل صفحات QuizSpace الحالية من نفس الموقع داخل حزمة native.
            الإصدار: `${{ steps.release_meta.outputs.version_name }}`.
            تسجيل البريد وGoogle يستخدمان Auth الموقع، وGoogle يعيد التطبيق عبر deep link بعد اختيار الحساب.
            يتم الحفاظ على package name وشهادة التوقيع لتثبيت التحديث فوق النسخة السابقة.

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
