name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
          VITE_AI_WORKER_URL: ${{ secrets.VITE_AI_WORKER_URL }}
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Cancel stuck deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          # Get all in-progress deployments for the github-pages environment
          DEPLOYMENTS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/deployments?environment=github-pages&per_page=10")
          echo "$DEPLOYMENTS" | python3 -c "
          import json,sys,urllib.request,os
          token = os.environ['GITHUB_TOKEN']
          repo = os.environ.get('REPO','$REPO')
          deps = json.load(sys.stdin)
          for d in deps:
            dep_id = d['id']
            # Get status of this deployment
            req = urllib.request.Request(
              f'https://api.github.com/repos/$REPO/deployments/{dep_id}/statuses',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
            )
            try:
              statuses = json.loads(urllib.request.urlopen(req).read())
              latest = statuses[0]['state'] if statuses else 'unknown'
              if latest in ('in_progress', 'queued', 'pending'):
                print(f'Cancelling stuck deployment {dep_id} (state: {latest})')
                data = json.dumps({'state':'inactive'}).encode()
                cancel_req = urllib.request.Request(
                  f'https://api.github.com/repos/$REPO/deployments/{dep_id}/statuses',
                  data=data, method='POST',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
                )
                urllib.request.urlopen(cancel_req)
                print(f'Marked {dep_id} as inactive')
            except Exception as e:
              print(f'Skipping {dep_id}: {e}')
          " 2>/dev/null || true
          sleep 3

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4


  deploy-worker:
    name: Deploy AI Worker
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker Dependencies
        working-directory: worker
        run: npm install

      - name: Deploy AI Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml



