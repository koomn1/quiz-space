name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
          VITE_AI_WORKER_URL: ${{ secrets.VITE_AI_WORKER_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || 'BGeggKssxQJez09uO0tV0PBfer-lBMHXNxkuqeUdCJ0EJWziVvi0v0Mf-Y5R_b_hB26GTgc4bWkpJZJ0lOz7NgI' }}
        run: pnpm build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Cancel stuck deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          DEPLOYMENTS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/deployments?environment=github-pages&per_page=10")
          echo "$DEPLOYMENTS" | python3 -c "
          import json,sys,urllib.request,os
          token = os.environ['GITHUB_TOKEN']
          repo = os.environ.get('REPO','$REPO')
          deps = json.load(sys.stdin)
          for d in deps:
            dep_id = d['id']
            req = urllib.request.Request(
              f'https://api.github.com/repos/$REPO/deployments/{dep_id}/statuses',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
            )
            try:
              statuses = json.loads(urllib.request.urlopen(req).read())
              latest = statuses[0]['state'] if statuses else 'unknown'
              if latest in ('in_progress', 'queued', 'pending'):
                print(f'Cancelling stuck deployment {dep_id} (state: {latest})')
                data = json.dumps({'state':'inactive'}).encode()
                cancel_req = urllib.request.Request(
                  f'https://api.github.com/repos/$REPO/deployments/{dep_id}/statuses',
                  data=data, method='POST',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
                )
                urllib.request.urlopen(cancel_req)
                print(f'Marked {dep_id} as inactive')
            except Exception as e:
              print(f'Skipping {dep_id}: {e}')
          " 2>/dev/null || true
          sleep 3

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-share-pages:
    name: Deploy Clean Share Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Share Page Dependencies
        run: npm install --global wrangler@4.119.0
      - name: Ensure Share Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages project create quiz-space-share --production-branch main || true
      - name: Deploy Clean Share Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy share-pages --project-name quiz-space-share --branch main

  deploy-app-pages:
    name: Deploy Full App to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Root App for Cloudflare Pages
        env:
          DEPLOY_TARGET: cloudflare-pages
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
          VITE_AI_WORKER_URL: ${{ secrets.VITE_AI_WORKER_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || 'BGeggKssxQJez09uO0tV0PBfer-lBMHXNxkuqeUdCJ0EJWziVvi0v0Mf-Y5R_b_hB26GTgc4bWkpJZJ0lOz7NgI' }}
        run: pnpm build
      - name: Install Cloudflare Wrangler
        run: npm install --global wrangler@4.119.0
      - name: Ensure Full App Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages project create quiz-space-app --production-branch main || true
      - name: Deploy Full App to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name quiz-space-app

  e2e-public:
    name: Public Profile Asset E2E
    needs: [deploy-pages, deploy-app-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Public Profile Asset E2E
        env:
          PLAYWRIGHT_BASE_URL: https://quiz-space-app.pages.dev/
        run: pnpm e2e -- --grep "published profile asset delivery"

  deploy-worker:
    name: Deploy AI Worker
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker Dependencies
        working-directory: worker
        run: npm install

      - name: Ensure Extraction Queue Exists
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler queues create quizspace-extraction-jobs --config wrangler.toml || true

      - name: Validate OpenRouter provider secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/openrouter-provider-check.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data '{"model":"nvidia/nemotron-3-super-120b-a12b:free","messages":[{"role":"user","content":"Return OK only."}],"max_tokens":8}' \
            https://openrouter.ai/api/v1/chat/completions)
          echo "OpenRouter provider check HTTP status: ${status}"
          # 429 means the key is recognized but temporarily rate-limited;
          # the Worker already has multiple OpenRouter model fallbacks.
          if [ "${status}" != '200' ] && [ "${status}" != '429' ]; then
            echo 'OpenRouter rejected the credential or request configuration.'
            exit 1
          fi

      - name: Sync AI Worker provider secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.VITE_OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          sync_secret() {
            name="$1"
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.toml >/dev/null
            fi
          }
          sync_secret OPENROUTER_API_KEY
      - name: Deploy AI Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
