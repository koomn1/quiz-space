name: Mobile Flutter Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub release tag; automatic pushes generate one from the run number'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Analyze, test, build APK, and publish release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Calculate release version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          requested_tag='${{ inputs.release_tag }}'
          if [ -n "$requested_tag" ]; then
            release_tag="$requested_tag"
          else
            release_tag="mobile-v1.0.${GITHUB_RUN_NUMBER}"
          fi
          version_name="${release_tag#mobile-v}"
          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like mobile-v1.2.3"
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Generate native Android project files
        run: flutter create --platforms=android --project-name badawy --org com.quizspace .

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Configure Firebase Android project
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_ANDROID_CONFIG_JSON"
          mkdir -p config
          printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > config/google-services.json
          python3 tool/prepare_android_firebase.py

      - name: Verify Android signing secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/quizspace-upload-keystore.jks
          actual_hash=$(sha256sum /tmp/quizspace-upload-keystore.jks | cut -d' ' -f1)
          if [ "$actual_hash" != "de9382e0ca60f6191f7ae631f63c850ac27be179d2fdf2345057238d6d3c321b" ]; then
            echo 'The Android keystore secret payload is corrupted or incomplete.'
            exit 1
          fi
          if ! keytool -list -keystore /tmp/quizspace-upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo 'The Android keystore payload is correct but its password secret is incorrect.'
            exit 1
          fi

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is required for update-safe releases.'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD is required.'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is required.'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is required.'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          python3 tool/prepare_android_signing.py

      - name: Configure Android permissions and update deep link
        run: python3 tool/patch_android_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Configure native Android permission bridge
        run: python3 tool/prepare_native_permissions.py

      - name: Generate official QuizSpace launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Dart and widget tests
        run: flutter test

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: >-
          flutter build apk --release
          --build-name=${{ steps.release_meta.outputs.version_name }}
          --build-number=${{ steps.release_meta.outputs.version_code }}
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Verify signing continuity
        shell: bash
        run: |
          set -euo pipefail
          latest_url=$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/koomn1/quiz-space/releases/latest | jq -r '.assets[]? | select(.name == "quizspace-mobile.apk") | .browser_download_url' | head -n1)
          if [ -z "$latest_url" ] || [ "$latest_url" = "null" ]; then
            echo 'No previous APK release found; skipping continuity check.'
            exit 0
          fi
          curl -fsSL "$latest_url" -o /tmp/previous-quizspace.apk
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -x "$apksigner_path"
          current_cert=$("$apksigner_path" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | awk -F': ' '/SHA-256 digest:/ {print $2; exit}')
          previous_cert=$("$apksigner_path" verify --print-certs /tmp/previous-quizspace.apk | awk -F': ' '/SHA-256 digest:/ {print $2; exit}')
          test -n "$current_cert" && test -n "$previous_cert"
          if [ "$current_cert" != "$previous_cert" ]; then
            echo 'Signing certificate changed; refusing to publish an APK that cannot update the installed app.'
            exit 1
          fi
          echo 'Signing certificate matches the previous release.'

      - name: Prepare release files
        id: release_files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../release-artifacts/quizspace-mobile.apk
          (cd ../release-artifacts && sha256sum quizspace-mobile.apk > quizspace-mobile.apk.sha256)
          echo "apk_path=release-artifacts/quizspace-mobile.apk" >> "$GITHUB_OUTPUT"
          echo "checksum_path=release-artifacts/quizspace-mobile.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: QuizSpace Mobile ${{ steps.release_meta.outputs.release_tag }}
          generate_release_notes: true
          files: |
            ${{ steps.release_files.outputs.apk_path }}
            ${{ steps.release_files.outputs.checksum_path }}
          body: |
            نسخة Android أصلية من QuizSpace.

            الإصدار: `${{ steps.release_meta.outputs.version_name }}`.

            التطبيق يفحص هذا الـRelease تلقائيًا. عند وجود إصدار أعلى، تظهر شاشة تحديث إجبارية وتُنزل APK داخل التطبيق، تتحقق من SHA-256، ثم تفتح مثبت Android لتثبيت النسخة فوق القديمة.

            التثبيت الأول: نزّل `quizspace-mobile.apk` وافتحه بعد السماح بتثبيت التطبيقات من هذا المصدر.

            لا يتم حذف بيانات Firebase أو بيانات التطبيق أثناء التحديث. تحديث APK العادي يحتاج تأكيد مثبت Android من المستخدم؛ التثبيت الصامت غير متاح للتطبيقات العادية.
