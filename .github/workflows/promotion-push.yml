name: Scheduled Promotion Push

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send rotating promotion
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PROMOTION_CRON_SECRET: ${{ secrets.PROMOTION_CRON_SECRET }}
        run: node scripts/send_scheduled_promotion.mjs

      - name: Send daily engagement reminders
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PROMOTION_CRON_SECRET: ${{ secrets.PROMOTION_CRON_SECRET }}
        run: |
          set -euo pipefail
          function_url="${SUPABASE_FUNCTION_URL:-}"
          if [[ -z "$function_url" ]]; then
            function_url="${SUPABASE_URL%/}/functions/v1"
          fi
          [[ "$function_url" =~ ^https?:// ]] || { echo "Missing a valid Supabase Functions URL" >&2; exit 1; }
          status=$(curl -sS -o /tmp/daily-reminders.json -w '%{http_code}' \
            -X POST "${function_url}/send-daily-engagement-reminders" \
            -H "x-promotion-cron-secret: ${PROMOTION_CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            --data '{}')
          echo "Daily engagement reminders HTTP status: ${status}"
          cat /tmp/daily-reminders.json
          test "${status}" = '200'
