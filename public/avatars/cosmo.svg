<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="70%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>
    <radialGradient id="coreGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f5e8ff" />
      <stop offset="35%" stop-color="#c4b5fd" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </radialGradient>
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="ringInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bgGrad)" />
  <circle cx="64" cy="64" r="36" fill="#8b5cf6" opacity="0.4" filter="url(#glow)" />
  <!-- Outer Orbit -->
  <g transform="translate(64, 64)">
    <ellipse rx="52" ry="20" fill="none" stroke="url(#ringOuter)" stroke-width="3.5" opacity="0.9" transform="rotate(-25)" />
    <circle cx="48" cy="-22" r="4" fill="#f5d0fe" transform="rotate(-25)" />
  </g>
  <!-- Inner Orbit -->
  <g transform="translate(64, 64)">
    <ellipse rx="40" ry="15" fill="none" stroke="url(#ringInner)" stroke-width="3" opacity="0.85" transform="rotate(35)" />
    <circle cx="-32" cy="18" r="3.5" fill="#bae6fd" transform="rotate(35)" />
  </g>
  <!-- Core -->
  <circle cx="64" cy="64" r="24" fill="url(#coreGrad)" />
  <circle cx="56" cy="56" r="6" fill="#ffffff" opacity="0.7" />
</svg>
