<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اختبار تفاعلي جديد | QuizSpace</title>
  <meta name="description" content="هل تستطيع تصدّر لوحة المتصدرين؟ حل الاختبار الآن على QuizSpace.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="QuizSpace">
  <meta property="og:title" content="اختبار تفاعلي جديد | QuizSpace">
  <meta property="og:url" content="https://quiz-space-share.pages.dev/share/quiz">
  <meta property="og:description" content="هل تستطيع تصدّر لوحة المتصدرين؟ حل الاختبار الآن وشارك التحدي مع أصدقائك.">
  <meta property="og:image" content="https://quiz-space-app.pages.dev/quiz-share-card.jpg">
  <meta property="og:image:alt" content="صورة تحدي Quiz Space">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="اختبار تفاعلي جديد | QuizSpace">
  <meta name="twitter:description" content="حل الاختبار الآن وشارك التحدي مع أصدقائك.">
  <meta name="twitter:image" content="https://quiz-space-app.pages.dev/quiz-share-card.jpg">
  <meta name="twitter:image:alt" content="صورة تحدي Quiz Space">
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b2a;color:#fff;font-family:Arial,sans-serif}main{text-align:center;padding:2rem}a{color:#c4b5fd}</style>
</head>
<body>
  <main><h1 id="share-title">جاري فتح الاختبار...</h1><p id="share-description">استعد للتحدي.</p><a id="fallback" href="https://quiz-space-app.pages.dev/">العودة إلى QuizSpace</a></main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var id = params.get('quiz');
      var title = params.get('title');
      var challenge = params.get('challenge') === 'true';
      var appBase = 'https://quiz-space-app.pages.dev';
      var shareBase = 'https://quiz-space-share.pages.dev/share/quiz';
      var query = new URLSearchParams();
      if (id) query.set('quiz', id);
      if (title) query.set('title', title);
      if (challenge) query.set('challenge', 'true');
      var target = appBase + '/#/quiz/' + encodeURIComponent(id || '') + (challenge ? '?challenge=true' : '');
      var cleanShareTarget = shareBase + (query.toString() ? '?' + query.toString() : '');
      var safeTitle = title && title.trim() ? title.trim().slice(0, 160) : 'اختبار تفاعلي جديد';
      var pageTitle = safeTitle + ' | QuizSpace';
      document.title = pageTitle;
      document.querySelector('meta[property="og:title"]').setAttribute('content', pageTitle);
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', pageTitle);
      document.querySelector('meta[property="og:description"]').setAttribute('content', 'حل «' + safeTitle + '» الآن وشارك التحدي مع أصدقائك.');
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', 'حل «' + safeTitle + '» الآن وشارك التحدي مع أصدقائك.');
      document.getElementById('share-title').textContent = safeTitle;
      document.getElementById('share-description').textContent = challenge ? 'استعد للتحدي ونافس أصدقاءك.' : 'حل الاختبار الآن وشارك نتيجتك.';
      document.getElementById('fallback').href = appBase + '/';
      if (id) setTimeout(function () { location.replace(cleanShareTarget); }, 50);
    }());
  </script>
</body>
</html>
