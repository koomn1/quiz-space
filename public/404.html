<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <title>جارٍ تحويل Quiz Space</title>
  <script>
    (function () {
      var location = window.location;
      if (!/(^|\.)github\.io$/i.test(location.hostname)) return;
      var pathname = location.pathname;
      var oldBase = '/quiz-space';

      if (pathname === oldBase || pathname.indexOf(oldBase + '/') === 0) {
        pathname = pathname.slice(oldBase.length) || '/';
      }

      var target = 'https://quiz-space-app.pages.dev' + (pathname.charAt(0) === '/' ? pathname : '/' + pathname);
      location.replace(target + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>جارٍ تحويلك إلى Quiz Space...</p>
</body>
</html>
