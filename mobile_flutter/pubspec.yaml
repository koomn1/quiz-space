name: quizspace_mobile
description: Native QuizSpace mobile app for quizzes, profiles, and solver insights.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.3
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  apk_sideload: ^0.0.2
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/quizspace-logo.webp
    - assets/quizspace-icon.webp
    - assets/quizspace-icon.png

flutter_launcher_icons:
  android: true
  image_path: assets/quizspace-icon.png
  adaptive_icon_background: '#0B1020'
  adaptive_icon_foreground: assets/quizspace-icon.png
